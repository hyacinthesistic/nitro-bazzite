#
# tuned configuration
#
#

[main]
summary = General non-specialized tuned profile with added Bazzite tweaks
include = throughput-performance

[variables]
thunderx_cpuinfo_regex=CPU part\s+:\s+(0x0?516)|(0x0?af)|(0x0?a[0-3])|(0x0?b8)\b

[cpu]
# governor=performance
# energy_perf_bias=performance
# min_perf_pct=100
# energy_performance_preference=performance
# boost=1

# Marvell ThunderX
[vm.thunderx]
type=vm
uname_regex=aarch64
cpuinfo_regex=${thunderx_cpuinfo_regex}
transparent_hugepages=never

[disk]
# The default unit for readahead is KiB.  This can be adjusted to sectors
# by specifying the relevant suffix, eg. (readahead => 8192 s). There must
# be at least one space between the number and suffix (if suffix is specified).
readahead=>4096

# Marvell ThunderX
[sysctl.thunderx]
type=sysctl
uname_regex=aarch64
cpuinfo_regex=${thunderx_cpuinfo_regex}
kernel.numa_balancing=0

[acpi]
platform_profile=balanced-performance

[sysctl]
net.core.somaxconn=>2048
vm.swappiness=180
vm.vfs_cache_pressure=50
vm.page-cluster=0
vm.dirty_background_bytes=67108864
vm.dirty_bytes=268435456
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
vm.min_free_kbytes=262144

[vm]
transparent_hugepages=madvise

# [video]
# panel_power_savings=0

[script]
script=${i:PROFILE_DIR}/script.sh


