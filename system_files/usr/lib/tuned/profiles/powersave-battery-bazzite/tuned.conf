#
# tuned configuration
#

[main]
summary = Optimize for low power consumption with added Bazzite tweaks
include = powersave-bazzite

[cpu]
governor=schedutil|conservative|powersave
energy_perf_bias=powersave|power
energy_performance_preference=power
boost=0

[acpi]
platform_profile=low-power|quiet

[audio]
timeout=10

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[scsi_host]
alpm=med_power_with_dipm

[sysctl]
vm.dirty_writeback_centisecs=1500

[sysfs]
/sys/class/drm/card*/device/power_dpm_force_performance_level=low
